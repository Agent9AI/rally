<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 1600 1600">
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f3f7fd"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102847"/>
      <stop offset="1" stop-color="#173d72"/>
    </linearGradient>
    <linearGradient id="blueWash" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eef4ff"/>
      <stop offset="1" stop-color="#f8fbff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="28" stdDeviation="34" flood-color="#10233f" flood-opacity=".16"/>
    </filter>
  </defs>

  <rect width="1600" height="1600" fill="url(#page)"/>
  <rect x="0" y="0" width="400" height="16" fill="#4285f4"/>
  <rect x="400" y="0" width="400" height="16" fill="#ea4335"/>
  <rect x="800" y="0" width="400" height="16" fill="#fbbc04"/>
  <rect x="1200" y="0" width="400" height="16" fill="#34a853"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(108 92)">
      <rect width="78" height="78" rx="22" fill="#ffffff" stroke="#dfe7f2"/>
      <image href="rally-symbol.png" x="8" y="8" width="62" height="62" preserveAspectRatio="xMidYMid meet"/>
      <text x="100" y="37" fill="#10233f" font-size="35" font-weight="750">Rally</text>
      <text x="100" y="65" fill="#718099" font-size="17" font-weight="600" letter-spacing="1.4">BY AGENT9</text>
    </g>

    <g transform="translate(1125 106)">
      <rect width="365" height="58" rx="29" fill="#ffffff" stroke="#c9d8ed"/>
      <circle cx="30" cy="29" r="7" fill="#34a853"/>
      <text x="51" y="36" fill="#35516f" font-size="17" font-weight="700" letter-spacing="1.2">FORTIFIED ENTERPRISE FLEET</text>
    </g>

    <text x="108" y="270" fill="#246bfd" font-size="25" font-weight="700" letter-spacing="4">ONE CONNECTED, SECURE AI WORKFORCE</text>
    <text x="108" y="382" fill="#10233f" font-size="91" font-weight="500" letter-spacing="-4.5">Your company already uses</text>
    <text x="108" y="482" fill="#10233f" font-size="91" font-weight="500" letter-spacing="-4.5">multiple AIs.</text>
    <text x="108" y="582" fill="#246bfd" font-size="91" font-weight="500" letter-spacing="-4.5">Rally makes them one secure,</text>
    <text x="108" y="682" fill="#246bfd" font-size="91" font-weight="500" letter-spacing="-4.5">accountable team.</text>
    <text x="108" y="755" fill="#526178" font-size="30">Connect the models, APIs, and systems you already trust.</text>

    <g transform="translate(100 832)" filter="url(#shadow)">
      <rect width="1400" height="650" rx="48" fill="url(#panel)"/>
      <g transform="translate(54 42)">
        <rect width="58" height="58" rx="17" fill="#ffffff"/>
        <image href="rally-symbol.png" x="6" y="6" width="46" height="46" preserveAspectRatio="xMidYMid meet"/>
        <text x="78" y="28" fill="#ffffff" font-size="24" font-weight="750">Rally Research</text>
        <text x="78" y="51" fill="#9eb4d1" font-size="16">research@company.com</text>
        <g transform="translate(1095 4)">
          <rect width="190" height="46" rx="23" fill="#123f49" stroke="#28766b"/>
          <circle cx="25" cy="23" r="6" fill="#5ad6a1"/>
          <text x="45" y="29" fill="#bdf5dc" font-size="15" font-weight="750" letter-spacing="1.2">ALWAYS ON</text>
        </g>
      </g>

      <g transform="translate(54 142)">
        <rect width="392" height="354" rx="28" fill="#ffffff"/>
        <text x="30" y="46" fill="#246bfd" font-size="16" font-weight="750" letter-spacing="2">1 · COMMISSION</text>
        <circle cx="56" cy="103" r="30" fill="#ea4335"/>
        <text x="46" y="113" fill="#ffffff" font-size="23" font-weight="750">M</text>
        <text x="102" y="97" fill="#263a55" font-size="20" font-weight="750">Maya Chen</text>
        <text x="102" y="122" fill="#8591a3" font-size="14">to Rally Research · 9:14 AM</text>
        <text x="30" y="181" fill="#10233f" font-size="23" font-weight="750">Build our AI investment</text>
        <text x="30" y="213" fill="#10233f" font-size="23" font-weight="750">brief for next quarter.</text>
        <text x="30" y="260" fill="#5c6c81" font-size="16">Use only approved company systems.</text>
        <rect x="30" y="294" width="92" height="34" rx="17" fill="#f0f4fa"/>
        <text x="52" y="316" fill="#526986" font-size="13" font-weight="700">EMAIL</text>
        <rect x="132" y="294" width="140" height="34" rx="17" fill="#f0f4fa"/>
        <text x="154" y="316" fill="#526986" font-size="13" font-weight="700">ONE REQUEST</text>
      </g>

      <g transform="translate(500 142)">
        <rect width="400" height="354" rx="28" fill="url(#blueWash)" stroke="#8fb5f4"/>
        <text x="30" y="46" fill="#246bfd" font-size="16" font-weight="750" letter-spacing="2">2 · COORDINATE</text>
        <text x="30" y="92" fill="#10233f" font-size="28" font-weight="750">Rally assembles the team.</text>
        <g transform="translate(30 130)">
          <rect width="340" height="52" rx="15" fill="#ffffff" stroke="#d5e1f3"/>
          <circle cx="28" cy="26" r="15" fill="#4285f4"/>
          <text x="23" y="32" fill="#ffffff" font-size="15" font-weight="750">G</text>
          <text x="58" y="32" fill="#29405f" font-size="17" font-weight="750">Gemini plans + researches</text>
        </g>
        <g transform="translate(30 194)">
          <rect width="340" height="52" rx="15" fill="#ffffff" stroke="#d5e1f3"/>
          <circle cx="28" cy="26" r="15" fill="#dc6958"/>
          <text x="23" y="32" fill="#ffffff" font-size="15" font-weight="750">C</text>
          <text x="58" y="32" fill="#29405f" font-size="17" font-weight="750">Claude builds + synthesizes</text>
        </g>
        <g transform="translate(30 258)">
          <rect width="340" height="52" rx="15" fill="#ffffff" stroke="#d5e1f3"/>
          <circle cx="28" cy="26" r="15" fill="#202124"/>
          <text x="23" y="32" fill="#ffffff" font-size="15" font-weight="750">O</text>
          <text x="58" y="32" fill="#29405f" font-size="17" font-weight="750">Codex challenges + verifies</text>
        </g>
      </g>

      <g transform="translate(954 142)">
        <rect width="392" height="354" rx="28" fill="#f6fcf8" stroke="#75c69d"/>
        <text x="30" y="46" fill="#137333" font-size="16" font-weight="750" letter-spacing="2">3 · DELIVER</text>
        <g transform="translate(30 78)">
          <rect width="72" height="72" rx="22" fill="#34a853"/>
          <path d="M20 38l13 13 22-30" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
        <text x="30" y="190" fill="#10233f" font-size="27" font-weight="750">AI investment brief.pdf</text>
        <text x="30" y="226" fill="#596a80" font-size="16">Recommendation, risks, sources,</text>
        <text x="30" y="251" fill="#596a80" font-size="16">and an independent review receipt.</text>
        <rect x="30" y="286" width="178" height="38" rx="19" fill="#e3f4ea"/>
        <text x="53" y="311" fill="#246b49" font-size="14" font-weight="750">✓ INDEPENDENTLY VERIFIED</text>
      </g>

      <g transform="translate(54 545)">
        <line x1="0" y1="0" x2="1292" y2="0" stroke="#365678"/>
        <text x="0" y="55" fill="#b8c9dc" font-size="20">owner ≠ verifier</text>
        <text x="177" y="55" fill="#7590ad" font-size="20">·</text>
        <text x="205" y="55" fill="#b8c9dc" font-size="20">approved systems only</text>
        <text x="430" y="55" fill="#7590ad" font-size="20">·</text>
        <text x="458" y="55" fill="#b8c9dc" font-size="20">evidence travels with every result</text>
        <text x="1002" y="55" fill="#73dab0" font-size="19" font-weight="750">BUILT ON GOOGLE CLOUD</text>
      </g>
    </g>
  </g>
</svg>
