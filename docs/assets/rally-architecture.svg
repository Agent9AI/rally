<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Rally production architecture</title>
  <desc id="desc">Email and Google-authenticated dashboard requests enter a Cloudflare Worker and D1 durable intake. A deterministic Rally runner sends an IAM-authenticated, idempotent request to a Gemini 3.7 Flash Google ADK coordinator on Cloud Run. Firestore provides atomic state and leases, Secret Manager and Cloud KMS protect credentials, and Cloud Trace with OpenTelemetry records metadata-only traces. Claude, Gemini, and OpenAI Codex workers can participate, while deterministic policy requires a different verifier than owner. Final evidence returns by email and a private workspace dashboard.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07120f"/>
      <stop offset="0.58" stop-color="#0a1713"/>
      <stop offset="1" stop-color="#08110f"/>
    </linearGradient>
    <linearGradient id="googleBoundary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e2234"/>
      <stop offset="1" stop-color="#0c1d1a"/>
    </linearGradient>
    <linearGradient id="runnerCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#143528"/>
      <stop offset="1" stop-color="#10251e"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
    <marker id="arrowMint" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 10 5.5 1 10Z" fill="#70efb5"/>
    </marker>
    <marker id="arrowBlue" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 10 5.5 1 10Z" fill="#6ea8ff"/>
    </marker>
    <style>
      .sans{font-family:Inter,Arial,Helvetica,sans-serif}
      .mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
      .eyebrow{font-size:14px;font-weight:800;letter-spacing:2.8px;fill:#70efb5}
      .headline{font-size:44px;font-weight:760;letter-spacing:-1.5px;fill:#f3faf7}
      .subtitle{font-size:18px;font-weight:460;fill:#9aafa6}
      .lane{font-size:12px;font-weight:850;letter-spacing:2.2px;fill:#738a80}
      .meta{font-size:11px;font-weight:820;letter-spacing:1.25px;fill:#70efb5}
      .title{font-size:19px;font-weight:760;fill:#eef7f3}
      .body{font-size:14px;font-weight:480;fill:#9fb2aa}
      .tiny{font-size:11px;font-weight:650;letter-spacing:.45px;fill:#789087}
      .chip{font-size:11px;font-weight:800;letter-spacing:1px;fill:#b9d1ff}
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <circle cx="1430" cy="35" r="330" fill="#6ea8ff" opacity="0.035"/>
  <circle cx="110" cy="880" r="280" fill="#70efb5" opacity="0.025"/>

  <g class="sans">
    <text class="eyebrow" x="70" y="66">RALLY / PRODUCTION ARCHITECTURE</text>
    <text class="headline" x="70" y="121">One durable intake. Google-native coordination. Zero self-approval.</text>
    <text class="subtitle" x="70" y="158">Cloudflare holds intake and evidence; Google Cloud anchors identity, coordination, secrets, and traces.</text>
    <line x1="70" y1="194" x2="1530" y2="194" stroke="#22382f"/>

    <text class="lane" x="70" y="225">DURABLE INTAKE</text>

    <!-- Entry channels -->
    <g filter="url(#shadow)">
      <rect x="70" y="252" width="225" height="96" rx="15" fill="#10231b" stroke="#2b4b3d"/>
      <rect x="70" y="372" width="225" height="96" rx="15" fill="#111f2d" stroke="#35547a"/>
    </g>
    <text class="meta mono" x="92" y="280">SIGNED CHANNEL</text>
    <text class="title" x="92" y="311">Email commission</text>
    <text class="body" x="92" y="334">Resend signed inbound</text>

    <text class="meta mono" x="92" y="400" fill="#a8c8ff">GOOGLE SIGN-IN</text>
    <text class="title" x="92" y="431">Private dashboard</text>
    <text class="body" x="92" y="454">Authenticated · workspace-scoped</text>

    <!-- Cloudflare durable edge -->
    <g filter="url(#shadow)">
      <rect x="340" y="306" width="310" height="134" rx="17" fill="#251a12" stroke="#86522f"/>
    </g>
    <text class="meta mono" x="366" y="338" fill="#ffbe86">CLOUDFLARE EDGE</text>
    <text class="title" x="366" y="373">Worker + D1 durable intake</text>
    <text class="body" x="366" y="400">Queue · dedupe · idempotent receipts</text>
    <rect x="366" y="414" width="175" height="5" rx="2.5" fill="#f29f58" opacity="0.8"/>

    <path d="M295 300 H320 Q329 300 329 309 V353 Q329 362 340 362" fill="none" stroke="#70efb5" stroke-width="2.3" marker-end="url(#arrowMint)"/>
    <path d="M295 420 H320 Q329 420 329 411 V391 Q329 382 340 382" fill="none" stroke="#6ea8ff" stroke-width="2.3" marker-end="url(#arrowBlue)"/>

    <!-- Deterministic authority -->
    <g filter="url(#shadow)">
      <rect x="700" y="306" width="310" height="134" rx="17" fill="url(#runnerCard)" stroke="#3e7c61"/>
    </g>
    <text class="meta mono" x="726" y="338">POLICY, NOT MODEL OUTPUT</text>
    <text class="title" x="726" y="373">Deterministic Rally authority</text>
    <text class="body" x="726" y="399">Local JSON · budgets · rotation</text>
    <text class="tiny mono" x="726" y="421">AUTHORITATIVE CHECKLIST + DONE GATE</text>

    <line x1="650" y1="373" x2="686" y2="373" stroke="#70efb5" stroke-width="2.5" marker-end="url(#arrowMint)"/>
    <text class="tiny mono" x="668" y="359" text-anchor="middle">POLL + ACK</text>

    <!-- Google Cloud boundary -->
    <rect x="1045" y="220" width="485" height="394" rx="22" fill="url(#googleBoundary)" stroke="#6ea8ff" stroke-width="1.5" stroke-dasharray="8 7"/>
    <rect x="1068" y="235" width="247" height="25" rx="12.5" fill="#6ea8ff" opacity="0.14"/>
    <text class="chip" x="1086" y="252">GOOGLE CLOUD COORDINATION + CONTROL</text>

    <g filter="url(#shadow)">
      <rect x="1070" y="274" width="435" height="108" rx="15" fill="#102a40" stroke="#4c7eb8"/>
    </g>
    <text class="meta mono" x="1094" y="303" fill="#b9d1ff">IAM-PROTECTED CLOUD RUN / VERTEX AI</text>
    <text class="title" x="1094" y="335">Gemini 3.7 Flash + Google ADK</text>
    <text class="body" x="1094" y="360">Required intake gate · bounded handoff</text>

    <path d="M1010 349 H1027 Q1034 349 1034 342 V328 Q1034 323 1045 323 H1056" fill="none" stroke="#6ea8ff" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
    <text class="tiny mono" x="1028" y="301" text-anchor="middle" transform="rotate(-90 1028 301)">IAM + SERVICE TOKEN</text>

    <g>
      <rect x="1070" y="405" width="205" height="80" rx="13" fill="#10231e" stroke="#315b49"/>
      <rect x="1300" y="405" width="205" height="80" rx="13" fill="#10231e" stroke="#315b49"/>
      <rect x="1070" y="508" width="205" height="80" rx="13" fill="#10231e" stroke="#315b49"/>
      <rect x="1300" y="508" width="205" height="80" rx="13" fill="#10231e" stroke="#315b49"/>
    </g>

    <text class="meta mono" x="1090" y="430">COMMISSION STATE</text>
    <text class="title" x="1090" y="456">Firestore</text>
    <text class="body" x="1090" y="477">Atomic claims · leases · fencing</text>

    <text class="meta mono" x="1320" y="430">CUSTOMER IDENTITY</text>
    <text class="title" x="1320" y="456">Cloud Run control plane</text>
    <text class="body" x="1320" y="477">Google account · sessions</text>

    <text class="meta mono" x="1090" y="533">METADATA-ONLY</text>
    <text class="title" x="1090" y="559">Cloud Trace + OTel</text>
    <text class="body" x="1090" y="580">Content capture off</text>

    <text class="meta mono" x="1320" y="533">CREDENTIAL CONTROLS</text>
    <text class="title" x="1320" y="559">Secret Manager + KMS</text>
    <text class="body" x="1320" y="580">Service token · connector vault</text>

    <path d="M1172 382 V397" fill="none" stroke="#6ea8ff" stroke-width="1.7" opacity="0.78"/>
    <!-- Participating-capable execution plane -->
    <text class="lane" x="70" y="647">LICENSED EXECUTION PLANE · THREE PARTICIPATING-CAPABLE MODEL FAMILIES</text>
    <rect x="65" y="663" width="1060" height="164" rx="20" fill="#0c1814" stroke="#243d33"/>
    <rect x="806" y="674" width="294" height="24" rx="12" fill="#173b2d" stroke="#32634e"/>
    <text class="meta mono" x="953" y="691" text-anchor="middle">DONE GATE · OWNER ≠ VERIFIER</text>

    <path d="M855 440 V652 Q855 656 850 656 H242 V682" fill="none" stroke="#70efb5" stroke-width="2.2" marker-end="url(#arrowMint)"/>
    <path d="M855 656 H577 V682" fill="none" stroke="#70efb5" stroke-width="2.2" marker-end="url(#arrowMint)"/>
    <path d="M855 656 H912 V682" fill="none" stroke="#70efb5" stroke-width="2.2" marker-end="url(#arrowMint)"/>
    <text class="tiny mono" x="872" y="640">BOUNDED TURNS</text>

    <g filter="url(#shadow)">
      <rect x="85" y="695" width="315" height="106" rx="15" fill="#281817" stroke="#835047"/>
      <rect x="420" y="695" width="315" height="106" rx="15" fill="#13213a" stroke="#436ca9"/>
      <rect x="755" y="695" width="315" height="106" rx="15" fill="#191b1e" stroke="#626971"/>
    </g>

    <text class="meta mono" x="108" y="724" fill="#ffb6aa">ANTHROPIC FAMILY</text>
    <text class="title" x="108" y="756">Claude worker</text>
    <text class="body" x="108" y="781">Claude CLI · implement · verify</text>

    <text class="meta mono" x="443" y="724" fill="#adcaff">GOOGLE FAMILY</text>
    <text class="title" x="443" y="756">Gemini worker</text>
    <text class="body" x="443" y="781">Antigravity CLI · implement · verify</text>

    <text class="meta mono" x="778" y="724" fill="#d5d8dc">OPENAI FAMILY</text>
    <text class="title" x="778" y="756">OpenAI Codex worker</text>
    <text class="body" x="778" y="781">Codex CLI · implement · verify</text>

    <!-- Evidence returns -->
    <text class="lane" x="1160" y="647">EVIDENCE RETURNS</text>
    <g filter="url(#shadow)">
      <rect x="1160" y="663" width="370" height="164" rx="20" fill="#10231b" stroke="#3d7058"/>
    </g>
    <text class="meta mono" x="1184" y="692">AFTER THE DETERMINISTIC GATE</text>
    <text class="title" x="1184" y="719">Verified result</text>

    <rect x="1182" y="736" width="326" height="34" rx="10" fill="#142d23" stroke="#315b49"/>
    <circle cx="1202" cy="753" r="5" fill="#70efb5"/>
    <text class="body" x="1217" y="758">Email report</text>
    <text class="tiny mono" x="1489" y="757" text-anchor="end">RESEND</text>

    <rect x="1182" y="778" width="326" height="34" rx="10" fill="#142d23" stroke="#315b49"/>
    <circle cx="1202" cy="795" r="5" fill="#6ea8ff"/>
    <text class="body" x="1217" y="800">Private dashboard evidence</text>
    <text class="tiny mono" x="1489" y="799" text-anchor="end">D1</text>

    <line x1="1125" y1="745" x2="1146" y2="745" stroke="#70efb5" stroke-width="2.5" marker-end="url(#arrowMint)"/>

    <line x1="70" y1="853" x2="1530" y2="853" stroke="#22382f"/>
    <text class="tiny mono" x="70" y="879">LOAD-BEARING INVARIANT  ·  done requires owner ≠ verified_by  ·  enforced by deterministic Rally code</text>
    <text class="tiny mono" x="1530" y="879" text-anchor="end">RALLY BY AGENT9</text>
  </g>
</svg>
