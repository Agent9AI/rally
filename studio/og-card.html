<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=1200, initial-scale=1">
    <title>Rally social card</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
      body {
        position: relative;
        padding: 58px 64px;
        color: #eff8f4;
        background:
          radial-gradient(circle at 92% 0%, rgba(114,168,255,.18), transparent 38%),
          radial-gradient(circle at 5% 105%, rgba(124,247,189,.12), transparent 42%),
          #06100d;
        font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body::after {
        position: absolute;
        inset: 22px;
        border: 1px solid rgba(124,247,189,.16);
        border-radius: 22px;
        content: "";
      }
      .eyebrow { margin: 0 0 42px; color: #7cf7bd; font-size: 15px; font-weight: 850; letter-spacing: .17em; }
      h1 { max-width: 850px; margin: 0; font-size: 70px; line-height: .98; letter-spacing: -.055em; }
      h1 em { color: #7cf7bd; font-style: normal; }
      .lede { max-width: 760px; margin: 28px 0 0; color: #a6bab1; font-size: 21px; line-height: 1.42; }
      .brand { position: absolute; right: 64px; bottom: 52px; display: flex; align-items: center; gap: 12px; font-size: 17px; font-weight: 850; }
      .mark { display: grid; width: 36px; height: 36px; place-items: center; color: #06100d; border-radius: 9px; background: #7cf7bd; }
      .proof { position: absolute; left: 64px; bottom: 54px; display: flex; gap: 30px; color: #8fa39a; font: 700 13px/1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .05em; }
      .proof b { color: #eff8f4; }
    </style>
  </head>
  <body>
    <p class="eyebrow">THE ENGINEERING AGENT YOUR WHOLE COMPANY CAN EMAIL</p>
    <h1>One request.<br>Two model families.<br><em>Zero self-approval.</em></h1>
    <p class="lede">Gemini governs the handoff. Claude and Gemini build, challenge, and independently verify.</p>
    <div class="proof"><span><b>63</b> TESTS</span><span><b>3/3</b> LIVE ADK EVALS</span><span><b>1.00</b> TRAJECTORY + QUALITY</span></div>
    <div class="brand"><span class="mark">R</span><span>Rally by Agent9</span></div>
  </body>
</html>
