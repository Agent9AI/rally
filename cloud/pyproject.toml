[project]
name = "rally-google-coordinator"
version = "0.1.0"
description = "Google ADK and Cloud Run execution path for Rally"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "google-adk>=1.15,<2",
  "google-cloud-firestore>=2.16,<3",
  "google-cloud-logging>=3.12,<4",
  "opentelemetry-exporter-gcp-trace>=1.15,<2",
  "opentelemetry-instrumentation-google-genai>=0.1,<1",
  "opentelemetry-sdk>=1.30,<2",
  "pydantic>=2.8,<3",
  "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.23,<1",
  "ruff>=0.8,<1",
]

[project.optional-dependencies]
eval = [
  "google-adk[eval]>=1.15,<2",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rally_adk"]

[tool.agents-cli]
name = "rally-google-coordinator"
description = "Asynchronous intake and governance coordinator for Rally"
base_template = "adk"
agent_directory = "rally_adk"
acli_version = "0.1.1"

[tool.agents-cli.create_params]
deployment_target = "cloud_run"
session_type = "in_memory"
cicd_runner = "github_actions"
include_data_ingestion = false
datastore = "none"
agent_guidance_filename = "AGENTS.md"
